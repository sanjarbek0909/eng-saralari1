<style>
:root{
  --bg:#14080b;
  --bg2:#1d0b10;
  --wine:#3a1420;
  --gold:#d8b679;
  --gold-hi:#f3dca4;
  --gold-lo:#9c7638;
  --ink:#f1e8da;
  --muted:#a8988c;
  --line:rgba(216,182,121,.22);
  --serif:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* Header */
header{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 5vw;background:linear-gradient(to bottom,rgba(20,8,11,.88),rgba(20,8,11,0));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.logo{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:.22em;color:var(--gold-hi);white-space:nowrap}
.logo small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.5em;color:var(--muted);margin-top:-4px}
nav{display:flex;gap:34px}
nav a{font-size:14px;color:var(--muted);transition:color .25s}
nav a:hover{color:var(--gold-hi)}
.head-right{display:flex;align-items:center;gap:16px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:0;padding:6px 12px;border-radius:999px;font-size:12px;letter-spacing:.08em;color:var(--muted);transition:all .25s}
.lang button[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo));color:#1a0c0f}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:2px;font-size:14px;font-weight:500;letter-spacing:.04em;border:1px solid transparent;transition:transform .25s,box-shadow .25s,background .25s}
.btn-gold{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:#1a0c0f}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(216,182,121,.25)}
.btn-ghost{border-color:var(--gold);color:var(--gold-hi);background:transparent}
.btn-ghost:hover{background:rgba(216,182,121,.1)}
.btn-sm{padding:10px 18px;font-size:13px}

/* Hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:130px 5vw 70px;overflow:hidden;background:
  radial-gradient(60% 70% at 74% 48%,rgba(120,36,56,.55),rgba(20,8,11,0) 70%),
  radial-gradient(40% 50% at 12% 100%,rgba(216,182,121,.10),rgba(20,8,11,0) 70%),
  var(--bg)}
#stage{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hero-fallback{position:absolute;right:12vw;top:50%;transform:translateY(-50%);width:min(30vw,300px);z-index:1}
.hero-content{position:relative;z-index:2;max-width:590px}
.hero-content>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero-content>*:nth-child(2){animation-delay:.12s}
.hero-content>*:nth-child(3){animation-delay:.24s}
.hero-content>*:nth-child(5){animation-delay:.36s}
.hero-content>*:nth-child(6){animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(46px,7.2vw,98px);line-height:.98;letter-spacing:-.015em;margin:0 0 26px;color:var(--ink)}
.hero p.sub{color:var(--muted);font-size:17px;max-width:44ch;margin:0 0 34px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:40px}
.m-spacer{display:none}
.pick-label{font-size:13px;color:var(--muted);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.02);border:1px solid var(--line);padding:8px 15px;border-radius:999px;font-size:13px;color:var(--muted);transition:all .25s}
.chip i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.chip:hover{color:var(--ink);border-color:var(--gold)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,182,121,.08)}
.now{min-height:70px}
.now b{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:32px;color:var(--gold-hi);line-height:1.15}
.now span{color:var(--muted);font-size:14px}

/* Sections */
section{position:relative}
.wrap{padding:130px 5vw}
h2{font-family:var(--serif);font-weight:300;font-size:clamp(38px,5vw,66px);line-height:1.05;margin:0 0 16px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:52ch;margin:0}
.collection{background:linear-gradient(to bottom,var(--bg),var(--bg2))}
.col-grid{display:grid;grid-template-columns:5fr 7fr;gap:6vw;margin-top:64px;align-items:start}
.preview{position:sticky;top:110px;height:min(72vh,620px);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(60% 55% at 50% 45%,var(--glow,rgba(120,36,56,.5)),rgba(20,8,11,0) 75%);transition:background .5s}
.preview svg{width:56%;max-width:260px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55));animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.preview b{margin-top:22px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;color:var(--gold-hi)}
.rows{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:22px;align-items:center;padding:26px 0;border-top:1px solid var(--line);cursor:pointer;transition:padding .35s,background .35s}
.row:hover,.row.on{padding-left:14px;background:linear-gradient(90deg,rgba(216,182,121,.07),transparent)}
.row .mini{width:44px}
.row h3{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;margin:0}
.row p{margin:4px 0 0;color:var(--muted);font-size:14px}
.row em{font-style:normal;color:var(--gold);font-size:13px;margin-left:8px}

.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:60px;border-top:1px solid var(--line)}
.why-item{padding:38px 30px 10px 0;border-left:1px solid var(--line);padding-left:30px}
.why-item:first-child{border-left:0;padding-left:0}
.why-item svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:22px}
.why-item h3{font-family:var(--serif);font-weight:500;font-size:27px;margin:0 0 8px}
.why-item p{margin:0;color:var(--muted);font-size:15px}

.contact{background:radial-gradient(70% 90% at 15% 100%,rgba(140,40,62,.55),rgba(20,8,11,0) 70%),var(--bg2);border-top:1px solid var(--line)}
.contact h2{font-size:clamp(44px,7vw,104px);max-width:12ch;font-weight:300;line-height:.98}
.contact .lead{margin:22px 0 38px;font-size:18px}
.contact .actions{margin:0}
footer{padding:34px 5vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px;background:var(--bg2)}
footer a:hover{color:var(--gold-hi)}
.tg{position:fixed;right:22px;bottom:22px;z-index:60;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo));display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 6px rgba(216,182,121,.14);transition:transform .25s}
.tg:hover{transform:scale(1.08)}
.tg svg{width:26px;height:26px;fill:#1a0c0f}

@media (max-width:980px){nav{display:none}}
@media (max-width:860px){
  .hero{align-items:flex-start;padding-top:110px}
  .m-spacer{display:block;height:44vh}
  .hero-fallback{width:44vw;right:28vw;top:60%}
  .col-grid{grid-template-columns:1fr;margin-top:40px}
  .preview{display:none}
  .row{grid-template-columns:44px 1fr;gap:16px}
  .row .btn{grid-column:2;justify-self:start}
  .why-item{border-left:0;padding-left:0;border-top:1px solid var(--line)}
  .why-item:first-child{border-top:0}
  .head-right .btn{display:none}
  .wrap{padding:90px 5vw}
}
@media (max-width:420px){.logo{font-size:21px}.lang button{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

/* ---------- Render collection ---------- */
var rowsEl=document.getElementById('rows'), previewEl=document.getElementById('preview');
SCENTS.forEach(function(s,i){
  var r=document.createElement('div');
  r.className='row'; r.tabIndex=0; r.dataset.i=i;
  r.innerHTML='<div class="mini">'+bottleSVG(s.color,'r'+i)+'</div>'+
    '<div><h3>'+s.name+'<em data-i18n="'+s.tag+'"></em></h3><p data-i18n="'+s.notes+'"></p></div>'+
    '<a class="btn btn-ghost btn-sm" href="https://t.me/luxora_admin" target="_blank" rel="noopener" data-i18n="ask"></a>';
  r.addEventListener('mouseenter',function(){setPreview(i)});
  r.addEventListener('focus',function(){setPreview(i)});
  rowsEl.appendChild(r);
});
function setPreview(i){
  var s=SCENTS[i];
  previewEl.style.setProperty('--glow',hexToRGBA(s.color,.5));
  previewEl.innerHTML=bottleSVG(s.color,'pv')+'<b>'+s.name+'</b>';
  Array.prototype.forEach.call(rowsEl.children,function(el,k){el.classList.toggle('on',k===i)});
}
setPreview(0);

/* ---------- Chips + hero scent ---------- */
var chipsEl=document.getElementById('chips');
SCENTS.forEach(function(s,i){
  var b=document.createElement('button');
  b.className='chip'; b.type='button'; b.setAttribute('aria-pressed',i===0);
  b.innerHTML='<i style="background:'+s.color+'"></i>'+s.name;
  b.addEventListener('click',function(){ chooseScent(i,true); });
  chipsEl.appendChild(b);
});
function renderNow(){
  document.getElementById('nowName').textContent=SCENTS[current].name;
  document.getElementById('nowNotes').textContent=t(SCENTS[current].notes);
  Array.prototype.forEach.call(chipsEl.children,function(el,k){el.setAttribute('aria-pressed',k===current)});
}

/* ---------- Language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===lang); });
  renderNow();
}
document.querySelectorAll('[data-lang]').forEach(function(b){
  b.addEventListener('click',function(){
    lang=b.dataset.lang;
    try{localStorage.setItem('luxora_lang',lang);}catch(e){}
    applyLang();
  });
});
applyLang();

/* ---------- 3D scene ---------- */
var api = { spray:function(){}, setColor:function(){} };
function chooseScent(i,doSpray){
  current=i; renderNow(); api.setColor(SCENTS[i].color); setPreview(i);
  if(doSpray) api.spray();
}
document.getElementById('sprayBtn').addEventListener('click',function(){ api.spray(); });

(function initThree(){
  var hero=document.getElementById('hero');
  var canvas=document.getElementById('stage');
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fallback(){
    var d=document.createElement('div'); d.className='hero-fallback'; d.innerHTML=bottleSVG(SCENTS[0].color,'fb');
    hero.appendChild(d);
  }
  if(!window.THREE){ fallback(); return; }
  var renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
  }catch(e){ fallback(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
  renderer.setClearColor(0x000000,0);

  function C(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(32,1,0.1,100);

  /* Studio environment for reflections */
  var envScene=new THREE.Scene();
  envScene.background=C('#0c0507');
  function strip(w,h,x,y,z,intensity,hex){
    var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:C(hex).multiplyScalar(intensity),side:THREE.DoubleSide}));
    m.position.set(x,y,z); m.lookAt(0,0,0); envScene.add(m);
  }
  strip(12,2.5,0,7,4,9,'#fff2dc');
  strip(2,12,-7,0,3,6,'#fff2dc');
  strip(2.5,10,7,1,2,5,'#d8b679');
  strip(14,7,0,0,-9,3,'#8a2a44');
  strip(10,2,0,-6,5,2,'#d8b679');
  var pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(envScene,0.03).texture;

  /* Lights */
  scene.add(new THREE.AmbientLight(0xffffff,0.25));
  var key=new THREE.DirectionalLight(0xffe6bd,1.4); key.position.set(3,4,6); scene.add(key);
  var rim=new THREE.PointLight(C('#d8b679'),1.6,20); rim.position.set(-4,2,-3); scene.add(rim);
  var flashLight=new THREE.PointLight(0xffffff,0,8); flashLight.position.set(0,1.6,2); scene.add(flashLight);

  var stageG=new THREE.Group(); scene.add(stageG);
  var bottle=new THREE.Group(); stageG.add(bottle);

  function rr(w,h,r){
    var s=new THREE.Shape(),x=-w/2,y=-h/2;
    s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
    s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
    s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
  }
  var glassGeo=new THREE.ExtrudeGeometry(rr(1.5,2,0.2),{depth:0.9,bevelEnabled:true,bevelThickness:0.1,bevelSize:0.1,bevelSegments:8,curveSegments:16});
  glassGeo.center();
  var glass=new THREE.Mesh(glassGeo,new THREE.MeshPhysicalMaterial({
    color:0xffffff,roughness:0.03,metalness:0,clearcoat:1,clearcoatRoughness:0.03,
    transparent:true,opacity:0.32,envMapIntensity:2.4,side:THREE.DoubleSide,depthWrite:false}));
  glass.renderOrder=2; bottle.add(glass);

  var liqGeo=new THREE.ExtrudeGeometry(rr(1.3,1.55,0.15),{depth:0.5,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:5,curveSegments:12});
  liqGeo.center();
  var liqMat=new THREE.MeshPhysicalMaterial({color:C(SCENTS[0].color),roughness:0.12,metalness:0.05,clearcoat:1,clearcoatRoughness:0.1,transparent:true,opacity:0.94,emissive:C(SCENTS[0].color),emissiveIntensity:0.18,envMapIntensity:1.2});
  var liquid=new THREE.Mesh(liqGeo,liqMat); liquid.position.y=-0.15; liquid.renderOrder=1; bottle.add(liquid);

  var goldMat=new THREE.MeshStandardMaterial({color:C('#d8b679'),metalness:1,roughness:0.22,envMapIntensity:1.6});
  var collar=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.38,0.24,48),goldMat); collar.position.y=1.22; bottle.add(collar);
  var neck=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.16,32),goldMat); neck.position.y=1.42; bottle.add(neck);
  var actuator=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.17,0.3,32),goldMat); var actBase=1.6; actuator.position.y=actBase; bottle.add(actuator);
  var nozzle=new THREE.Object3D(); nozzle.position.set(0,actBase+0.05,0.2); bottle.add(nozzle);
  var nozzleMesh=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.16,16),new THREE.MeshStandardMaterial({color:C('#f3dca4'),metalness:1,roughness:0.2}));
  nozzleMesh.rotation.x=Math.PI/2; nozzleMesh.position.set(0,actBase+0.05,0.16); bottle.add(nozzleMesh);

  /* Label */
  var lc=document.createElement('canvas'); lc.width=512; lc.height=360;
  var lctx=lc.getContext('2d');
  var labelTex=new THREE.CanvasTexture(lc); labelTex.encoding=THREE.sRGBEncoding; labelTex.anisotropy=8;
  function drawLabel(){
    lctx.clearRect(0,0,512,360);
    lctx.strokeStyle='rgba(243,220,164,.95)'; lctx.lineWidth=3; lctx.strokeRect(14,14,484,332);
    lctx.lineWidth=1; lctx.strokeRect(26,26,460,308);
    lctx.fillStyle='#f3dca4'; lctx.textAlign='center';
    if('letterSpacing' in lctx) lctx.letterSpacing='10px';
    lctx.font='600 84px "Cormorant Garamond", Georgia, serif';
    lctx.fillText('LUXORA',256+5,196);
    lctx.font='400 26px Jost, Arial, sans-serif';
    if('letterSpacing' in lctx) lctx.letterSpacing='12px';
    lctx.fillText('PARFUMES',256+6,250);
    lctx.fillRect(196,112,120,2);
    labelTex.needsUpdate=true;
  }
  drawLabel();
  if(document.fonts && document.fonts.load){
    Promise.all([document.fonts.load('600 84px "Cormorant Garamond"'),document.fonts.load('400 26px Jost')]).then(drawLabel).catch(function(){});
  }
  var label=new THREE.Mesh(new THREE.PlaneGeometry(1.05,0.74),new THREE.MeshBasicMaterial({map:labelTex,transparent:true,depthWrite:false,toneMapped:false}));
  label.position.set(0,-0.15,0.56); label.renderOrder=3; bottle.add(label);

  /* Pedestal */
  var ped=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.72,0.2,72),new THREE.MeshStandardMaterial({color:C('#1a0a0f'),metalness:0.9,roughness:0.28,envMapIntensity:1.4}));
  ped.position.y=-1.2; stageG.add(ped);
  var ring=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.018,16,120),new THREE.MeshBasicMaterial({color:C('#f3dca4'),toneMapped:false}));
  ring.rotation.x=Math.PI/2; ring.position.y=-1.1; stageG.add(ring);

  /* Soft texture */
  function softTexture(){
    var c=document.createElement('canvas'); c.width=c.height=64; var x=c.getContext('2d');
    var g=x.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
  }
  var soft=softTexture();

  /* Glow behind bottle */
  var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:soft,color:C('#c2476a'),transparent:true,opacity:0.32,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.scale.set(7,7,1); glow.position.set(0,0.2,-1.5); stageG.add(glow);

  /* Gold dust */
  var dustN=reduce?60:190, dustPos=new Float32Array(dustN*3);
  for(var i=0;i<dustN;i++){ dustPos[i*3]=(Math.random()-.5)*11; dustPos[i*3+1]=(Math.random()-.5)*7; dustPos[i*3+2]=(Math.random()-.5)*5-0.5; }
  var dustGeo=new THREE.BufferGeometry(); dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
  var dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({map:soft,size:0.11,color:C('#d8b679'),transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));
  dust.frustumCulled=false; scene.add(dust);

  /* Mist particles */
  var N=420;
  var mPos=new Float32Array(N*3), mSize=new Float32Array(N), mAlpha=new Float32Array(N);
  var mVel=new Float32Array(N*3), mLife=new Float32Array(N), mMax=new Float32Array(N), mBase=new Float32Array(N);
  for(var k=0;k<N;k++){ mLife[k]=1; mMax[k]=1; }
  var mGeo=new THREE.BufferGeometry();
  mGeo.setAttribute('position',new THREE.BufferAttribute(mPos,3));
  mGeo.setAttribute('aSize',new THREE.BufferAttribute(mSize,1));
  mGeo.setAttribute('aAlpha',new THREE.BufferAttribute(mAlpha,1));
  var mMat=new THREE.ShaderMaterial({
    uniforms:{uMap:{value:soft},uColor:{value:new THREE.Color(1,1,1)},uScale:{value:window.innerHeight}},
    vertexShader:'attribute float aSize;attribute float aAlpha;varying float vA;uniform float uScale;void main(){vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uScale/(-mv.z);gl_Position=projectionMatrix*mv;}',
    fragmentShader:'uniform sampler2D uMap;uniform vec3 uColor;varying float vA;void main(){vec4 t=texture2D(uMap,gl_PointCoord);gl_FragColor=vec4(uColor,t.a*vA);}',
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  });
  var mist=new THREE.Points(mGeo,mMat); mist.frustumCulled=false; scene.add(mist);
  var mCursor=0;

  var targetCol=C(SCENTS[0].color), sprayT=0, press=0, flash=0, emitAcc=0;
  function mistColor(){
    var c=liqMat.color.clone(); c.lerp(new THREE.Color(1,1,1),0.55); mMat.uniforms.uColor.value.copy(c);
  }
  var tmpV=new THREE.Vector3(), tmpQ=new THREE.Quaternion(), dirV=new THREE.Vector3();
  function emit(){
    var i=mCursor; mCursor=(mCursor+1)%N;
    nozzle.getWorldPosition(tmpV); bottle.getWorldQuaternion(tmpQ);
    dirV.set((Math.random()-.5)*.55+0.05,(Math.random()-.5)*.45+0.22,1).normalize().applyQuaternion(tmpQ);
    var sp=2.2+Math.random()*2.4;
    mPos[i*3]=tmpV.x; mPos[i*3+1]=tmpV.y; mPos[i*3+2]=tmpV.z;
    mVel[i*3]=dirV.x*sp; mVel[i*3+1]=dirV.y*sp; mVel[i*3+2]=dirV.z*sp;
    mLife[i]=0; mMax[i]=1.1+Math.random()*1.3; mBase[i]=0.12+Math.random()*0.16;
  }

  api.spray=function(){ sprayT=0.6; press=1; flash=1; };
  api.setColor=function(hex){ targetCol=C(hex); };

  /* Layout */
  var vw=1,vh=1;
  function resize(){
    var W=hero.clientWidth, H=hero.clientHeight;
    renderer.setSize(W,H,false);
    var aspect=W/H; camera.aspect=aspect;
    camera.position.set(0,0.4,8.8); camera.lookAt(0,0.1,0);
    camera.updateProjectionMatrix();
    vh=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.position.z; vw=vh*aspect;
    if(aspect>1.15){ stageG.position.set(vw*0.24,-0.2,0); stageG.scale.setScalar(1.05); }
    else { var sc=Math.max(0.42,Math.min(0.9,vw/4.3)); stageG.position.set(0,-vh*0.05+0.15,0); stageG.scale.setScalar(sc); }
    mMat.uniforms.uScale.value=H*renderer.getPixelRatio()*0.5/Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*0.5;
  }
  window.addEventListener('resize',resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(hero);
  resize();

  var mx=0,my=0;
  window.addEventListener('pointermove',function(e){ mx=(e.clientX/window.innerWidth-.5)*2; my=(e.clientY/window.innerHeight-.5)*2; },{passive:true});

  /* Loop */
  var clock=new THREE.Clock(), time=0, running=false, raf=0, rotY=0, rotX=0, visible=true, autoT=2.2;
  function tick(){
    raf=requestAnimationFrame(tick);
    var dt=Math.min(clock.getDelta(),0.05); time+=dt;

    var sy=Math.min(window.scrollY,900);
    var ty=mx*0.45+Math.sin(time*0.6)*0.28+sy*0.004;
    var tx=my*0.12;
    rotY+=(ty-rotY)*0.05; rotX+=(tx-rotX)*0.05;
    bottle.rotation.y=rotY; bottle.rotation.x=rotX;
    bottle.position.y=Math.sin(time*1.1)*0.05;

    liqMat.color.lerp(targetCol,0.06); liqMat.emissive.copy(liqMat.color);
    glow.material.color.copy(liqMat.color);
    mistColor();

    press*=Math.exp(-7*dt); actuator.position.y=actBase-0.09*press;
    flash*=Math.exp(-5*dt); flashLight.intensity=flash*3;

    if(sprayT>0){ sprayT-=dt; emitAcc+=dt*650; while(emitAcc>=1){ emit(); emitAcc-=1; } }

    for(var i=0;i<N;i++){
      if(mLife[i]>=mMax[i]){ mAlpha[i]=0; mSize[i]=0; continue; }
      mLife[i]+=dt; var p=mLife[i]/mMax[i];
      var drag=Math.exp(-2.3*dt);
      mVel[i*3]*=drag; mVel[i*3+1]=mVel[i*3+1]*drag+0.22*dt; mVel[i*3+2]*=drag;
      mPos[i*3]+=mVel[i*3]*dt; mPos[i*3+1]+=mVel[i*3+1]*dt; mPos[i*3+2]+=mVel[i*3+2]*dt;
      mSize[i]=mBase[i]*(1+p*3.4);
      mAlpha[i]=(p<0.08?p/0.08:1)*Math.pow(1-p,1.6)*0.42;
    }
    mGeo.attributes.position.needsUpdate=true; mGeo.attributes.aSize.needsUpdate=true; mGeo.attributes.aAlpha.needsUpdate=true;

    dust.rotation.y=time*0.03; dust.position.y=Math.sin(time*0.4)*0.15;

    if(!reduce && visible){ autoT-=dt; if(autoT<=0){ api.spray(); autoT=9; } }
    renderer.render(scene,camera);
  }
  function start(){ if(!running){ running=true; clock.getDelta(); tick(); } }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){ visible=en[0].isIntersecting; if(visible&&!document.hidden) start(); else stop(); },{threshold:0.02}).observe(hero);
  } else start();
  document.addEventListener('visibilitychange',function(){ if(document.hidden) stop(); else if(visible) start(); });
  start();
})();
</script>
